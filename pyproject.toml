[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overrev"
version = "0.3.0"
description = "Read-only Porsche DME over-rev counter reader (UDS over CAN); tested on a US 991.2 GT3 only"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "python-can>=4.6.1",
    "can-isotp>=2.0.7",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[project.scripts]
overrev = "overrev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
