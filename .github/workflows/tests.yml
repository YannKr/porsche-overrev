name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m venv .venv && .venv/bin/pip install -q -e '.[test]'
      - run: .venv/bin/python -m pytest -q
      - run: node --test tests/web/*.test.mjs
